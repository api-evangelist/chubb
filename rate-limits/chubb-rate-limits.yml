specification: API Commons Rate Limits
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/RateLimits
provider: Chubb
providerId: chubb
created: '2026-05-04'
# Provenance stamped 2026-08-11: this artifact was written by the API Evangelist
# bulk sweep dated 2026-05-04, not harvested from the provider. See roadmap#35.
method: generated
modified: '2026-05-05'
reconciled: false
tags:
  - Embedded Insurance
  - Insurance
  - Partner Integration
  - Rate Limiting
description: Chubb does not publish a public rate-limit policy for the Chubb Studio embedded-insurance
  APIs. Rate limits, throttling thresholds, and SLAs are defined in the partner integration documentation
  shared after a commercial agreement is in place. Production limits are typically set per partner
  tenant and aligned with expected policy-issuance volume.
notes: No public rate-limit page exists. Approved Chubb Studio partners receive integration documents
  with the applicable per-tenant ceilings.
sources:
  - https://chubbstudio.com/
responseCodes:
  throttled: 429
  serverError: 500
  serviceUnavailable: 503
limits:
  - name: Chubb Studio API requests
    scope: partner-tenant
    metric: varies
    limit: 'see Chubb Studio partner integration documentation'
    notes: Per-tenant throttling is configured during onboarding; ceilings are not published publicly.
policies:
  - name: Backoff Strategy
    description: On 429 / 5xx, retry with exponential backoff and jitter; honor Retry-After when
      present.
  - name: Sandbox vs Production
    description: Partners begin in a sandbox tenant with lower ceilings and are promoted to production
      after certification; production ceilings reflect the partner's expected issuance volume.
  - name: Idempotency
    description: Use partner-supplied idempotency keys on policy-creation calls to avoid duplicate
      issuance under retry pressure.
maintainers:
