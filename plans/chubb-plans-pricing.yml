description: Chubb does not publish list pricing for its insurance products or for its Chubb Studio
  embedded-insurance APIs. The Chubb Studio platform is partner-only — distributors (banks, retailers,
  travel platforms, fintechs, OEMs) are onboarded through a commercial agreement that defines
  per-policy economics (commission, profit-share, ceded premium) rather than per-API-call pricing.
  Underlying premium pricing is set by Chubb underwriters for each line and jurisdiction.
notes: No public pricing page is available. Pricing for embedded insurance is negotiated per
  partner and the API layer itself is bundled into the partner agreement.
