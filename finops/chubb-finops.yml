specification: FinOps Framework
specificationVersion: '1.0'
schema: https://www.finops.org/framework/
provider: Chubb
providerId: chubb
created: '2026-05-04'
modified: '2026-05-05'
reconciled: false
tags:
  - Embedded Insurance
  - Insurance
  - Partner Integration
  - FinOps
  - FOCUS
description: 'FOCUS-aligned FinOps for Chubb Studio: the cost shape for distributors is insurance
  economics (written premium, commission, ceded premium, claims) rather than per-API-call usage.
  Chubb does not bill partners for API access; cost flows through the partner agreement and
  policy-level settlement.'
notes: Chubb does not expose a metered-API billing surface. The FinOps shape below reflects the
  partner-agreement economics that govern Chubb Studio distribution.
sources:
  - https://www.chubb.com/
  - https://chubbstudio.com/
alignedWith:
  framework: FinOps Foundation Framework
  frameworkUrl: https://www.finops.org/framework/
  dataSpec: FOCUS
  dataSpecVersion: '1.3'
  dataSpecUrl: https://focus.finops.org/focus-specification/v1-3/
publisherName: Chubb Limited
serviceCategory: Insurance / Embedded Insurance
billingModel:
  pricingCategory: Take Rate (Premium / Commission)
  billingFrequency: Per Policy / Periodic Settlement
  billingCurrency: USD/EUR/GBP/multi-currency
  chargeCategories:
    - Purchase
    - Adjustment
    - Refund
    - Tax
focusColumns:
  ServiceName: Chubb Studio
  ServiceCategory: Insurance / Embedded Insurance
  ProviderName: Chubb
  PublisherName: Chubb Limited
  InvoiceIssuerName: Chubb Limited (or local Chubb underwriting entity)
  BillingCurrency: USD
  ChargeCategory: Purchase
  PricingCategory: Take Rate
meters:
  - name: written_premium
    description: Gross written premium for policies issued through the partner channel
    unit: policy
    aggregation: sum
    dimensions:
      - line
      - country
      - partner
  - name: commission
    description: Commission / take-rate paid to the distributing partner
    unit: policy
    aggregation: sum
    dimensions:
      - line
      - partner
  - name: claims_incurred
    description: Claims paid against policies in the partner book
    unit: claim
    aggregation: sum
    dimensions:
      - line
      - country
  - name: api_requests
    description: API calls against Chubb Studio (operational signal, not a billing meter)
    unit: request
    aggregation: sum
    dimensions:
      - partner
      - environment
principles:
  - name: Visibility
    description: Track partner-channel performance through Chubb Studio dashboards, monthly
      bordereau reports, and ceded-premium statements.
  - name: Allocation
    description: Allocate written-premium, commission, and claims by line of business, country, and
      partner so each distribution channel can be P&L'd separately.
  - name: Optimization
    description: Tune product mix, partner pricing, and underwriting filters to lift loss ratio and
      acquisition margin; consolidate low-volume partners on shared API tenants.
  - name: Accountability
    description: Underwriting owns loss ratio; distribution / partnerships owns commission economics;
      finance owns ceded-premium and claims settlement; technology owns Chubb Studio uptime and
      integration certification.
maintainers:
  - FN: Kin Lane
    email: kin@apievangelist.com
